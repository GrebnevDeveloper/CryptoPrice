name: CI/CD main flow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Find and upload APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            exit 1
          fi
          echo "Uploading: $APK_PATH"
          gh release upload <TAG> "$APK_PATH" --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/CryptoPrice_*.apk
        if-no-files-found: error

      - name: Fix permissions
        run: sudo chmod -R a+r app/build/outputs/

      - name: Run Ktlint
        run: ./gradlew ktlintCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Unit Tests
        run: ./gradlew test
